services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config:/app/config:ro
      - ./data:/app/data
    environment:
      - DOCKWATCH_CONFIG=/app/config/config.yaml
      - DOCKWATCH_DB_PATH=/app/data/dockwatch.db
      - DOCKWATCH_DOCKER_SOCKET=/var/run/docker.sock
      - DOCKWATCH_JWT_SECRET=${DOCKWATCH_JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3001,http://localhost:5173}
    user: root
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    user: root
    restart: unless-stopped

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16