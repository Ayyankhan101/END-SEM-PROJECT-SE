services:
  # PostgreSQL service (optional - for production)
  # To use Postgres: set DOCKWATCH_DB_TYPE=postgresql in environment
  # and uncomment this service
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     - POSTGRES_DB=dockwatch
  #     - POSTGRES_USER=dockwatch
  #     - POSTGRES_PASSWORD=${DOCKWATCH_DB_PASSWORD:-changeme}
  #   volumes:
  #     - ./data/postgres:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U dockwatch"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Docker Socket Proxy (Recommended for security)
  # To use:
  # 1. Uncomment this service
  # 2. Change backend DOCKWATCH_DOCKER_SOCKET to http://docker-proxy:2375
  # 3. Change backend volume mount to omit /var/run/docker.sock
  # docker-proxy:
  #   image: tecnativa/docker-socket-proxy
  #   environment:
  #     - CONTAINERS=1
  #     - IMAGES=1
  #     - NETWORKS=1
  #     - VOLUMES=1
  #     - POST=1
  #     - DELETE=1
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config:/app/config:ro
      - ./data:/app/data
    environment:
      - DOCKWATCH_CONFIG=/app/config/config.yaml
      - DOCKWATCH_DB_TYPE=${DOCKWATCH_DB_TYPE:-sqlite}
      - DOCKWATCH_DB_PATH=/app/data/dockwatch.db
      - DOCKWATCH_DB_URL=postgresql://dockwatch:${DOCKWATCH_DB_PASSWORD:-changeme}@postgres:5432/dockwatch
      - DOCKWATCH_DOCKER_SOCKET=unix:///var/run/docker.sock
      - DOCKWATCH_JWT_SECRET=${DOCKWATCH_JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3001,http://localhost:5173}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://localhost:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - OLLAMA_USE_CLOUD=${OLLAMA_USE_CLOUD:-false}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-haiku-20240307}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - TOGETHER_MODEL=${TOGETHER_MODEL:-meta-llama/Llama-3.1-8B-Instruct-Turbo}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      cache_from:
        - end-sem-project-se-frontend:latest
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    volumes:
      - npm_cache:/root/.npm

volumes:
  npm_cache:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16