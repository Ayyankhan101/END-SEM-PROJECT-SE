docker:
  # socket_path: (can be overridden via DOCKWATCH_DOCKER_SOCKET env var)
  socket_path: "/var/run/docker.sock"
  api_version: "1.47"
  poll_interval: 5
  max_containers: 50

monitoring:
  failure_detection_timeout: 30
  cpu_threshold: 90
  memory_threshold: 90
  pid_threshold: 1000

recovery:
  enabled: true
  actions:
    - type: restart
      max_attempts: 3
      delay: 5
    - type: notify
      max_attempts: 5

database:
  # path: (can be overridden via DOCKWATCH_DB_PATH env var)
  path: "dockwatch.db"
  metrics_ttl_days: 7

server:
  host: "0.0.0.0"
  port: 8000
  debug: false

security:
  # jwt_secret: (set via DOCKWATCH_JWT_SECRET environment variable)
  jwt_algorithm: "RS256"
  jwt_expiration_hours: 24

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://localhost:5173"
  allow_credentials: true